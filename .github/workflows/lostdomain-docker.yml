name: Docker Publish (lostdomain)

# Builds this fork's production images from the lostdomain branch. Kept as its
# own file, not as an extra branch in docker-publish.yml, so syncing upstream
# never conflicts here.
on:
  push:
    branches:
      - lostdomain
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# Only the newest commit's images matter.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Build Client Images
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set env vars
        run: |
          # Define platform pair (e.g., linux-amd64) and save to environment variables
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          # Define repository owner in lowercase for GHCR and save to env
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/rybbit-client
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=ghcr.io/${{ env.REPO_OWNER }}/rybbit-client",push-by-digest=true,name-canonical=true
          push: true
      - name: Export digests
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/client-${{ env.PLATFORM_PAIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-client-${{ env.PLATFORM_PAIR }}
          path: "/tmp/digests/*"
          retention-days: 1

  build-backend:
    name: Build Backend Images
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set env vars
        run: |
          # Define platform pair (e.g., linux-amd64) and save to environment variables
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          # Define repository owner in lowercase for GHCR and save to env
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/rybbit-backend
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=ghcr.io/${{ env.REPO_OWNER }}/rybbit-backend",push-by-digest=true,name-canonical=true
          push: true
      - name: Export digests
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/backend-${{ env.PLATFORM_PAIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: "/tmp/digests/*"
          retention-days: 1

  publish-images:
    name: Merge & Push Multi-arch Manifests
    permissions:
      contents: read
      packages: write
    needs:
      - build-client
      - build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: "digests-*"
          merge-multiple: true
      - name: Set env vars
        run: |
          # Define repository owner in lowercase for GHCR and save to env
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Metadata client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/rybbit-client
          # No `latest`, `edge` or version tags: those belong to upstream's
          # releases, which docker-publish.yml still builds from master.
          tags: |
            # Moving tag: always the newest lostdomain build
            type=raw,value=lostdomain,priority=900

            # Pinned tag for rollbacks, e.g. lostdomain-1a2b3c4
            type=sha,prefix=lostdomain-,priority=700
      - name: Push manifest client
        working-directory: /tmp/digests
        env:
          TAGS_JSON: ${{ steps.meta-client.outputs.json }}
        run: |
          digests=""

          for file in client-*; do
            digest=$(cat "$file")
            digests+="ghcr.io/${{ env.REPO_OWNER }}/rybbit-client@${digest} "
          done

          # Create a manifest list and push to GHCR
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$TAGS_JSON") \
            $digests
      - name: Inspect client image
        run: docker buildx imagetools inspect ghcr.io/${{ env.REPO_OWNER }}/rybbit-client:lostdomain
      - name: Metadata backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/rybbit-backend
          # No `latest`, `edge` or version tags: those belong to upstream's
          # releases, which docker-publish.yml still builds from master.
          tags: |
            # Moving tag: always the newest lostdomain build
            type=raw,value=lostdomain,priority=900

            # Pinned tag for rollbacks, e.g. lostdomain-1a2b3c4
            type=sha,prefix=lostdomain-,priority=700
      - name: Push manifest backend
        working-directory: /tmp/digests
        env:
          TAGS_JSON: ${{ steps.meta-backend.outputs.json }}
        run: |
          digests=""

          for file in backend-*; do
            digest=$(cat "$file")
            digests+="ghcr.io/${{ env.REPO_OWNER }}/rybbit-backend@${digest} "
          done

          # Create a manifest list and push to GHCR
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$TAGS_JSON") \
            $digests
      - name: Inspect backend image
        run: docker buildx imagetools inspect ghcr.io/${{ env.REPO_OWNER }}/rybbit-backend:lostdomain
